services:
  jaeger:
    image: jaegertracing/jaeger:2.4.0
    ports:
      - "16686:16686"   # Jaeger UI + query API

  collector:
    image: otel/opentelemetry-collector:0.119.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger

  backend:
    build: ./app
    environment:
      OTEL_SERVICE_NAME: demo-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_BSP_SCHEDULE_DELAY: "1000"   # export spans after 1s instead of 5s
    depends_on:
      - collector

  gateway:
    image: nginx:1.27
    ports:
      - "8081:80"
    volumes:
      # GATEWAY_MODE=passthrough (default) or strip
      - ./gateway/nginx.${GATEWAY_MODE:-passthrough}.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
