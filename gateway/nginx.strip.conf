# Same gateway, but trace context from outside is dropped at the edge.
# Setting a header to "" tells nginx not to pass it upstream.
events {}

http {
  server {
    listen 80;

    location / {
      proxy_set_header traceparent "";
      proxy_set_header tracestate  "";
      proxy_set_header baggage     "";
      proxy_pass http://backend:8080;
    }
  }
}
